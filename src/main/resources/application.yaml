spring:
  application:
    name: work-tracker
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:work_tracker_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
jwt:
  private-key-location: file:${JWT_PRIVATE_KEY:}
  public-key-location: file:${JWT_PUBLIC_KEY:}
  private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
  expiration-seconds: 3600

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
server:
  port: 8080