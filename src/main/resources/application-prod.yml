spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?sslmode=require
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  private-key-location: file:${JWT_PRIVATE_KEY:}
  public-key-location: file:${JWT_PUBLIC_KEY:}
  private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
  expiration-seconds: 3600

cors:
  # Must be set in production via CORS_ALLOWED_ORIGINS env var
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.drmj.work_tracker: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
